name: Verify project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: perfume_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d perfume_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/perfume_erp_test?schema=public
      AUTH_SECRET: ci-only-random-string-for-auth-tests-1234567890
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply committed schema migrations
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Run tests
        run: npm test
      - name: Verify PostgreSQL operations
        run: node --test tests/database.integration.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build application
        run: npm run build

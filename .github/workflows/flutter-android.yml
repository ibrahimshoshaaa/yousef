name: Flutter Android

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate standard Android host files
        run: flutter create --platforms android --project-name perfume_erp .
      - name: Fetch packages
        run: flutter pub get
      - name: Check Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: perfume-erp-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

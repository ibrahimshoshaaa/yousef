name: Flutter Android

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate standard Android host files
        run: flutter create --platforms android --project-name perfume_erp .
      - name: Enable Internet for release builds
        run: python3 tool/ensure_android_internet.py
      - name: Fetch packages
        run: flutter pub get
      - name: Check Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APKs per architecture
        run: flutter build apk --release --split-per-abi
      - name: Upload Android 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: perfume-erp-arm64-release
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload Android 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: perfume-erp-arm32-release
          path: mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
